name: Check header parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header-parity:
    name: Header parity and typed microdata fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Test the header parity check
        run: python3 -m unittest discover -s tests -v
      - name: Read the pinned shared revision
        id: pin
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("header/provenance.json"))["source"]["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned shared publication revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: ${{ steps.pin.outputs.commit }}
          path: .upstream/FAIR-bioHeaders-Specification
          persist-credentials: false
      - name: Check the header development copy against the pinned revision
        run: python3 scripts/check_header_parity.py --upstream .upstream/FAIR-bioHeaders-Specification

  shared-conformance:
    name: Pinned shared header conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Read the pinned shared revision
        id: pin
        run: |
          echo "commit=$(python3 -c 'import json; print(json.load(open("header/provenance.json"))["source"]["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: FAIR-bioHeaders/FAIR-bioHeaders-Specification
          ref: ${{ steps.pin.outputs.commit }}
          path: .upstream/FAIR-bioHeaders-Specification
          persist-credentials: false
      - name: Install the shared suite's released toolkit baseline
        run: |
          python3 -m venv "$RUNNER_TEMP/fhr-converter"
          "$RUNNER_TEMP/fhr-converter/bin/python" -m pip install 'fair-bioheaders[jsonld]==0.8.1'
      - name: Check shared fixture generation and independent checksums
        working-directory: .upstream/FAIR-bioHeaders-Specification
        run: python3 scripts/check_conformance.py
      - name: Run positive and rejection vectors with the released toolkit
        working-directory: .upstream/FAIR-bioHeaders-Specification
        run: python3 scripts/check_conformance.py --skip-regeneration --require-format jsonld --require-format fhp-fasta --require-format fhgff3 --converter "$RUNNER_TEMP/fhr-converter"
